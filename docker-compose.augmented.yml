name: infographic-lab-augmented

services:
  app:
    image: ${AUGMENTED_APP_IMAGE:-erwanntorrent/infographic-lab:augmented-v2}
    pull_policy: ${AUGMENTED_PULL_POLICY:-missing}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infographic-lab-augmented
    environment:
      PORT: 3092
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b-q4_K_M}
      AI_PROVIDER_ORDER: ollama
    ports:
      - "${AUGMENTED_BIND:-127.0.0.1}:${AUGMENTED_PORT:-3092}:3092"
    networks:
      - ollama_internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3092/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

networks:
  ollama_internal:
    external: true
    name: ollama_default
