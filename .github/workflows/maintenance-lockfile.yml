name: Generate maintenance lockfile

on:
  push:
    branches:
      - maintenance/reproducible-deps-2026-09-28

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/reproducible-deps-2026-09-28

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: add reproducible npm lockfile"
          git push origin HEAD:maintenance/reproducible-deps-2026-09-28
