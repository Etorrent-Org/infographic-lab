name: Publish Docker Hub images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Infographic Lab app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/infographic-lab:${{ steps.meta.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/infographic-lab:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      - name: Build and push Vibe runner
        uses: docker/build-push-action@v6
        with:
          context: ./runners/vibe
          file: ./runners/vibe/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VIBE_VERSION=2.21.0
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/infographic-vibe-runner:${{ steps.meta.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/infographic-vibe-runner:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
