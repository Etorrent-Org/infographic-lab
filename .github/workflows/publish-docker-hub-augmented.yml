name: Publish Docker Hub Augmented image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - "index.html"
      - "package*.json"
      - "server.mjs"
      - "src/**"
      - "public/**"
      - "vite.config.*"
      - "tsconfig*.json"
      - ".github/workflows/publish-docker-hub-augmented.yml"

permissions:
  contents: read

concurrency:
  group: docker-hub-augmented-app
  cancel-in-progress: true

jobs:
  publish:
    name: Publish augmented-v2 (linux/amd64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Augmented app
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          pull: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/infographic-lab:augmented-v2
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=augmented-v2
          cache-from: type=gha,scope=infographic-lab-augmented-amd64
          cache-to: type=gha,mode=max,scope=infographic-lab-augmented-amd64

      - name: Verify published image
        shell: bash
        run: docker buildx imagetools inspect "${{ secrets.DOCKERHUB_USERNAME }}/infographic-lab:augmented-v2"
