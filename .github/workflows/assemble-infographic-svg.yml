name: Assemble infographic SVG

on:
  push:
    branches:
      - docs/infographic-lab-overview
    paths:
      - '.svg-build/**'
      - '.github/workflows/assemble-infographic-svg.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/infographic-lab-overview
      - name: Assemble optimized SVG
        shell: bash
        run: |
          mkdir -p docs/images
          cat .svg-build/part*.b64 | base64 -d > docs/images/infographic-lab-overview.svg
          grep -q '<svg' docs/images/infographic-lab-overview.svg
          test "$(wc -c < docs/images/infographic-lab-overview.svg)" -eq 26088
      - name: Remove temporary assembly files
        shell: bash
        run: |
          rm -rf .svg-build
          rm -f .github/workflows/assemble-infographic-svg.yml
      - name: Commit assembled SVG
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/images/infographic-lab-overview.svg .svg-build .github/workflows/assemble-infographic-svg.yml
          git commit -m "Time - assemble l'infographie Infographic Lab"
          git push origin HEAD:docs/infographic-lab-overview
